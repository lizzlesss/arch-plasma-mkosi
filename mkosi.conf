[Config]
MinimumVersion=27~devel

[Build]
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Distribution]
Distribution=arch
Release=rolling
Repositories=core
			extra
			multilib

[Content]
#WithNetwork=yes
Packages=
		linux
		linux-firmware
		dosfstools
		pacman
		base
		base-devel
		polkit
BuildPackages=
		cargo
        cmake
        extra-cmake-modules

[Output]
ImageId=arch-plasma-mkosi
OutputDirectory=mkosi.output
Output=%i_%v_%a
