---
name: Build latest images

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '20 */6 * * *'  # 13:15am UTC everyday - schedule the build *after* the latest Arch Linux Archive update
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  arch-bootc:
    name: arch-bootc
    uses: ./.github/workflows/reusable-build-bootc.yaml
    with:
      image-name: "arch-bootc"
      image-tag: "latest"
      #profiles: "kernel-rolling"
    secrets: inherit

  arch-bootc-nvidia:
    name: arch-bootc-nvidia
    uses: ./.github/workflows/reusable-build-bootc.yaml
    with:
      image-name: "arch-bootc-nvidia"
      image-tag: "latest"
      profiles: "nvidia"
    secrets: inherit
